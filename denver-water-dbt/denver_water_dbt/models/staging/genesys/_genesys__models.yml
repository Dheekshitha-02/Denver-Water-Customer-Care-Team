version: 2

models:
  - name: stg_genesys__users
    description: Genesys agents with full_name. One row per user_id.
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: stg_genesys__queues
    description: One row per queue_id.
    columns:
      - name: queue_id
        data_tests: [unique, not_null]

  - name: stg_genesys__wrap_up_codes
    description: One row per wrap_up_code_id.
    columns:
      - name: wrap_up_code_id
        data_tests: [unique, not_null]

  - name: stg_genesys__interactions
    description: >
      One row per interaction_id. Adds customer_phone_norm / customer_email_norm
      (normalize_phone / normalize_email) for the CC&B customer match. Timestamps are UTC.
    columns:
      - name: interaction_id
        data_tests: [unique, not_null]
      - name: started_at
        data_tests: [not_null]
      - name: customer_phone_norm
        description: Digits-only phone, US country code removed. Null when no phone.
      - name: customer_email_norm
        description: Lower-cased, trimmed email. Null when no email.

  - name: stg_genesys__participants
    description: One row per participant_id (customer or agent).
    columns:
      - name: participant_id
        data_tests: [unique, not_null]

  - name: stg_genesys__transcripts
    description: One row per transcript turn; order by sequence_number within interaction_id.
    columns:
      - name: transcript_id
        data_tests: [unique, not_null]
      - name: message
        data_tests: [not_null]
